name: Apply Saga 0.52 Generic Abstractions

on:
  push:
    branches: [feature/saga-052-generic-abstractions]
    paths:
      - '.github/workflows/apply-052-generic-abstractions.yml'
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'feature/saga-052-generic-abstractions' || github.ref_name == 'feature/saga-052-generic-abstractions'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/saga-052-generic-abstractions
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: implementations/go/go.mod
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm
      - name: Apply 0.52 generic abstraction changes
        run: python tools/apply_052_generic_abstractions.py
      - name: Repair generated regression fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('implementations/go/cmd/saga-go/generic_abstractions_052_test.go')
          text = p.read_text(encoding='utf-8')
          text = text.replace('"42\n7"', '`42\n7`')
          text = text.replace('"5\nboom"', '`5\nboom`')
          text = text.replace('"3\n9"', '`3\n9`')
          p.write_text(text, encoding='utf-8')

          p = Path('tests/test_generic_abstractions_052.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '        print(is_ok(Result.Ok(1)))',
              '        let checked: Result[int, text] = Result.Ok(1)\n        print(is_ok(checked))',
          )
          p.write_text(text, encoding='utf-8')

          p = Path('implementations/go/cmd/saga-go/self_conformance.go')
          text = p.read_text(encoding='utf-8')
          old = '{"GSC047-tagged-union-payload", "enum Result{Ok(int),Err(text)}\\nlet value:Result=Result.Ok(42)\\nmatch value { case Result.Ok(number) { print(number) } case Result.Err(message) { print(message) } }", "42", ""},'
          new = '{"GSC047-tagged-union-payload", "enum Outcome{Ok(int),Err(text)}\\nlet value:Outcome=Outcome.Ok(42)\\nmatch value { case Outcome.Ok(number) { print(number) } case Outcome.Err(message) { print(message) } }", "42", ""},'
          if old not in text:
              raise SystemExit('GSC047 fixture not found')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Format Go implementation
        run: gofmt -w implementations/go/cmd/saga-go
      - name: Install Saga
        run: python -m pip install -e .
      - name: Compile Python sources
        run: python -m compileall -q saga tools tests/test_generic_abstractions_052.py
      - name: Run Saga 0.52 regression
        run: python -m unittest tests.test_generic_abstractions_052
      - name: Run Saga 0.51 regression
        run: python -m unittest tests.test_generic_adts_051
      - name: Run current Python language regression
        run: >-
          python -m unittest
          tests.test_control_ga_050
          tests.test_production_industrial_049
          tests.test_virtual_hil_048
          tests.test_advanced_motion_047
          tests.test_precision_machine_046
          tests.test_language_synthesis_045
      - name: Run complete Go regression
        working-directory: implementations/go
        run: go test ./...
      - name: Run Go vet
        working-directory: implementations/go
        run: go vet ./...
      - name: Remove integration helper
        run: rm -f tools/apply_052_generic_abstractions.py
      - name: Commit validated source
        run: |
          git config user.name "K.Saga"
          git config user.email "SagaK-dev@users.noreply.github.com"
          git add -A
          git commit -m "Build generic abstraction foundations for Saga 0.52"
          git push origin HEAD:feature/saga-052-generic-abstractions
