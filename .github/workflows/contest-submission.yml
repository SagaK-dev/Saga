name: Contest submission package

on:
  pull_request:
    branches: [main]
    paths:
      - "saga/**"
      - "docs/**"
      - "examples/**"
      - "tests/**"
      - "tools/build_contest_submission.py"
      - "SUBMISSION_README_JA.md"
      - "CONTEST_DEMO.md"
      - "README.md"
      - "pyproject.toml"
      - ".github/workflows/contest-submission.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Submission preflight
        run: python tools/build_contest_submission.py --check-only

      - name: Test submission builder
        run: python -m pytest tests/test_build_contest_submission.py -q

      - name: Build deterministic source ZIP
        run: python tools/build_contest_submission.py

      - name: Verify ZIP can be opened
        run: python -m zipfile -t dist/Saga-DIFF-Shizuoka-2026.zip

      - name: Write outer SHA-256
        run: sha256sum dist/Saga-DIFF-Shizuoka-2026.zip | tee dist/Saga-DIFF-Shizuoka-2026.zip.sha256

      - name: Upload contest artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saga-DIFF-Shizuoka-2026-source
          path: |
            dist/Saga-DIFF-Shizuoka-2026.zip
            dist/Saga-DIFF-Shizuoka-2026.zip.sha256
          if-no-files-found: error
          compression-level: 0
