name: Saga 0.53 control hardening apply

on:
  push:
    branches: [fix/saga-053-control-input-hardening]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/saga-053-control-input-hardening
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: implementations/go/go.mod
      - name: Apply reviewed hardening
        run: python tools/_saga_053_hardening_patch.py
      - name: Format Go sources
        run: gofmt -w implementations/go/cmd/saga-go/drone_control.go implementations/go/cmd/saga-go/drone_autonomy_041.go implementations/go/cmd/saga-go/machine_drone_focus_053_test.go
      - name: Install Saga
        run: python -m pip install -e .
      - name: Python control regression
        run: python -m unittest tests.test_machine_drone_focus_053 tests.test_drone_control_040 tests.test_drone_vision_comm_041
      - name: Go control regression
        working-directory: implementations/go
        run: go test ./cmd/saga-go
      - name: Commit verified hardening
        run: |
          git config user.name "Saga control maintenance"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/saga-053-hardening-apply.yml tools/_saga_053_hardening_patch.py
          git add saga/stdlib/drone_control.py implementations/go/cmd/saga-go/drone_control.go implementations/go/cmd/saga-go/drone_autonomy_041.go tests/test_machine_drone_focus_053.py implementations/go/cmd/saga-go/machine_drone_focus_053_test.go
          git commit -m "Harden drone control input validation"
          git push origin HEAD:fix/saga-053-control-input-hardening
