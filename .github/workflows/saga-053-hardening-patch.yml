name: Saga 0.53 control hardening patch

on:
  push:
    branches: [fix/saga-053-control-input-hardening]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/saga-053-control-input-hardening
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: implementations/go/go.mod
      - name: Apply reviewed control hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one patch anchor, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          py = "saga/stdlib/drone_control.py"
          replace_once(py, '''def _positive(name: str, value: Decimal) -> Decimal:
              value = _finite(name, value)
              if value <= 0:
                  raise DroneControlError(f"{name} must be > 0")
              return value


          def _clamp(value: Decimal, low: Decimal, high: Decimal) -> Decimal:
          ''', '''def _positive(name: str, value: Decimal) -> Decimal:
              value = _finite(name, value)
              if value <= 0:
                  raise DroneControlError(f"{name} must be > 0")
              return value


          def _latitude(name: str, value: Decimal) -> Decimal:
              value = _finite(name, value)
