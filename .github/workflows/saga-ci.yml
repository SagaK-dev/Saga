name: Saga core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-and-go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - uses: actions/setup-go@v7
        with:
          go-version-file: implementations/go/go.mod
          cache-dependency-path: implementations/go/go.mod
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad
      - name: Enable unprivileged namespaces for strict sandbox regression
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu 24.04 may gate unprivileged user namespaces through AppArmor.
          # The runner is ephemeral; enable the kernel facility, then prove the
          # exact namespace shape Saga's plugin sandbox needs as the runner user.
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          unshare --user --map-root-user --mount --pid --fork --ipc --uts --net -- true
      - name: Install Saga and full core-test extras
        run: python -m pip install -e '.[dev,crypto,media,websocket]'
      - name: Compile Python sources
        run: python -m compileall -q saga tools
      - name: Run complete Python regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/test_*.py; do
            pattern="$(basename "$test_file")"
            echo "::group::$pattern"
            python -m unittest discover -s tests -p "$pattern"
            echo "::endgroup::"
          done
      - name: Run Python-Go Standard Core conformance
        run: python conformance/go_standard_core.py
      - name: Run Go regression
        working-directory: implementations/go
        run: go test ./...
      - name: Run Go vet
        working-directory: implementations/go
        run: go vet ./...

  clean-package-install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel outside the checkout and run contest smoke test
        run: |
          wheel="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m venv /tmp/saga-wheel-env
          /tmp/saga-wheel-env/bin/python -m pip install "$wheel"
          cd /tmp
          /tmp/saga-wheel-env/bin/saga --version
          /tmp/saga-wheel-env/bin/saga-contest-demo --output /tmp/saga-wheel-demo
          /tmp/saga-wheel-env/bin/saga check /tmp/saga-wheel-demo/diff_safe_control.saga
          /tmp/saga-wheel-env/bin/saga-control-report /tmp/saga-wheel-demo/diff_safe_control.saga
          if /tmp/saga-wheel-env/bin/saga-control-report /tmp/saga-wheel-demo/diff_unsafe_control.saga; then
            echo "unsafe contest example unexpectedly passed" >&2
            exit 1
          fi
          test -f /tmp/saga-wheel-demo/index.html
          test -f /tmp/saga-wheel-demo/manifest.json
      - name: Install source distribution outside the checkout
        run: |
          sdist="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$sdist"
          python -m venv /tmp/saga-sdist-env
          /tmp/saga-sdist-env/bin/python -m pip install "$sdist"
          cd /tmp
          /tmp/saga-sdist-env/bin/saga --version
          /tmp/saga-sdist-env/bin/saga-contest-demo --output /tmp/saga-sdist-demo
          test -f /tmp/saga-sdist-demo/index.html
          test -f /tmp/saga-sdist-demo/manifest.json
