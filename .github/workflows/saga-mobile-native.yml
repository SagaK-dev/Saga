name: Saga native mobile build evidence

permissions:
  contents: read

on:
  workflow_dispatch:

env:
  GOMOBILE_VERSION: v0.0.0-20260730202154-c700fe717e6e

jobs:
  android-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: implementations/go/go.mod
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.5.0'}
      - run: python -m pip install -e .
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Install pinned gomobile tools
        run: go install golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION} && go install golang.org/x/mobile/cmd/gobind@${GOMOBILE_VERSION} && "$(go env GOPATH)/bin/gomobile" init
      - name: Generate Android application and runtime
        run: saga mobile android examples/learning/01_foundation.saga --output /tmp/saga-android --application-id dev.saga.qualification
      - name: Build Standard Core AAR
        run: PATH="$(go env GOPATH)/bin:$PATH" /tmp/saga-android/build-standard-runtime.sh
      - name: Build APK
        run: gradle -p /tmp/saga-android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: saga-android-apk, path: /tmp/saga-android/app/build/outputs/apk/debug/*.apk}

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: implementations/go/go.mod
      - run: python -m pip install -e .
      - name: Install pinned gomobile tools
        run: go install golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION} && go install golang.org/x/mobile/cmd/gobind@${GOMOBILE_VERSION} && "$(go env GOPATH)/bin/gomobile" init
      - name: Generate iOS runtime
        run: saga mobile ios examples/learning/01_foundation.saga --output /tmp/saga-ios --bundle-id dev.saga.qualification
      - name: Build real iOS XCFramework
        run: PATH="$(go env GOPATH)/bin:$PATH" /tmp/saga-ios/build-standard-runtime.sh
      - name: Inspect architectures
        run: find /tmp/saga-ios/SagaStandardCore.xcframework -maxdepth 3 -type f -print
      - uses: actions/upload-artifact@v4
        with: {name: saga-ios-xcframework, path: /tmp/saga-ios/SagaStandardCore.xcframework}
