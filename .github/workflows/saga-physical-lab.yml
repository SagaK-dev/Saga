name: Saga physical hardware lab

on:
  workflow_dispatch:
    inputs:
      operator_confirmed:
        description: 'I inspected the real GPU and gamepad on the lab host (not a VM/software renderer).'
        type: boolean
        required: true
        default: false
      gpu_driver:
        description: 'GPU model and installed driver version, confirmed by the operator'
        type: string
        required: true
      gamepad_id:
        description: 'Real USB/Bluetooth gamepad model and connection type, confirmed by the operator'
        type: string
        required: true

permissions:
  contents: read

# A physical lab must not start a second actuator/GPU test during the first.
concurrency:
  group: saga-physical-lab
  cancel-in-progress: false

jobs:
  hardware-lab:
    # Require an operator-controlled Linux machine; the Vulkan gate is Linux-only.
    # No GitHub-hosted runner or software Vulkan device qualifies as physical evidence.
    runs-on: [self-hosted, linux, saga-hardware-lab]
    timeout-minutes: 45
    steps:
      - name: Require approved main branch for hardware access
        shell: bash
        env:
          QUALIFICATION_REF: ${{ github.ref }}
        run: |
          if [[ "$QUALIFICATION_REF" != 'refs/heads/main' ]]; then
            echo "::error::Physical lab may only execute reviewed main"
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - uses: actions/setup-go@v7
        with:
          go-version-file: implementations/go/go.mod
          cache-dependency-path: implementations/go/go.mod
      - run: python -m pip install -e '.[dev,game,iot]'
      - name: Physical qualification
        run: python tools/platform_qualification_current.py --output validation/physical-lab.json
        env:
          SAGA_PHYSICAL_GAMEPAD: '1'
          SAGA_GPIO_LIVE: ${{ vars.SAGA_GPIO_LIVE }}
          SAGA_GPIO_OUTPUT_PIN: ${{ vars.SAGA_GPIO_OUTPUT_PIN }}
      - name: Require physical gates and record operator declaration
        if: always()
        run: |
          python tools/check_live_qualification.py physical validation/physical-lab.json \
            --receipt validation/physical-lab-receipt.json
        env:
          SAGA_PHYSICAL_OPERATOR_CONFIRMED: ${{ inputs.operator_confirmed }}
          SAGA_PHYSICAL_GPU_DRIVER: ${{ inputs.gpu_driver }}
          SAGA_PHYSICAL_GAMEPAD_ID: ${{ inputs.gamepad_id }}
          SAGA_GPIO_LIVE: ${{ vars.SAGA_GPIO_LIVE }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saga-physical-lab
          path: |
            validation/physical-lab.json
            validation/physical-lab-receipt.json
          if-no-files-found: warn
