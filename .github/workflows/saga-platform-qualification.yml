name: Saga platform qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'saga/**'
      - 'implementations/**'
      - 'tools/platform_qualification.py'
      - 'tools/platform_qualification_current.py'
      - 'tools/machine_control_qualification.py'
      - 'tools/machine_control_qualification_current.py'
      - 'pyproject.toml'
      - '.github/workflows/saga-platform-qualification.yml'
  pull_request:
    paths:
      - 'saga/**'
      - 'implementations/**'
      - 'tools/platform_qualification.py'
      - 'tools/platform_qualification_current.py'
      - 'tools/machine_control_qualification.py'
      - 'tools/machine_control_qualification_current.py'
      - 'pyproject.toml'
      - '.github/workflows/saga-platform-qualification.yml'

permissions:
  contents: read

jobs:
  linux-hosted-real:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - uses: actions/setup-go@v7
        with:
          go-version-file: implementations/go/go.mod
          cache-dependency-path: implementations/go/go.mod
      - uses: actions/setup-java@v5
        with: {distribution: 'temurin', java-version: '21'}
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libvulkan-dev mesa-vulkan-drivers xvfb
      - name: Install qualification dependencies
        run: python -m pip install -e '.[dev,game,bigdata,cloud,iot]'
      - name: Run platform qualification
        run: python tools/platform_qualification_current.py --output validation/platform-qualification-ci.json
        env:
          SDL_AUDIODRIVER: dummy
      - name: Require software qualification gates
        run: |
          python - <<'PY'
          import json
          d=json.load(open('validation/platform-qualification-ci.json'))
          g={x['id']:x for x in d['gates']}
          assert g['pygame-runtime']['status']=='PASS', g['pygame-runtime']
          assert g['spark-runtime']['status']=='PASS', g['spark-runtime']
          assert g['machine-control-software']['status']=='PASS', g['machine-control-software']
          assert g['vulkan-swapchain-present']['status'].startswith('PASS'), g['vulkan-swapchain-present']
          PY
      - uses: actions/upload-artifact@v4
        with: {name: saga-platform-qualification-linux, path: validation/platform-qualification-ci.json}

  aws-live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    environment: saga-aws-qualification
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - name: Configure AWS OIDC credentials
        if: vars.SAGA_AWS_QUALIFICATION_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SAGA_AWS_QUALIFICATION_ROLE_ARN }}
          aws-region: ${{ vars.SAGA_AWS_QUALIFICATION_REGION || 'us-east-1' }}
      - run: python -m pip install -e '.[dev,cloud]'
      - name: Execute Saga -> boto3 -> AWS STS
        if: vars.SAGA_AWS_QUALIFICATION_ROLE_ARN != ''
        run: python tools/platform_qualification_current.py --output validation/aws-live.json
        env:
          SAGA_AWS_LIVE: '1'
          AWS_REGION: ${{ vars.SAGA_AWS_QUALIFICATION_REGION || 'us-east-1' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: saga-aws-live, path: validation/aws-live.json, if-no-files-found: ignore}
