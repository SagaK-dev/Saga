[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saga-language"
version = "0.52.0"
description = "Reference implementation of the readable, exact-number, capability-secured Saga programming language"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [{name = "Saga Language Project"}]
keywords = ["programming-language", "compiler", "interpreter", "systems-programming", "machine-control", "exact-arithmetic", "capability-security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Compilers",
  "Topic :: Software Development :: Interpreters",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SagaK-dev/Saga"
Repository = "https://github.com/SagaK-dev/Saga"
Issues = "https://github.com/SagaK-dev/Saga/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
websocket = ["websocket-client"]
crypto = ["cryptography"]
media = ["Pillow", "opencv-python"]
game = ["pygame"]
cloud = ["boto3"]
iot = ["gpiozero"]
bigdata = ["pyspark"]
mobile = ["briefcase", "toga"]
all = ["websocket-client", "cryptography", "Pillow", "opencv-python", "pygame", "boto3", "gpiozero", "pyspark", "briefcase", "toga"]

[project.scripts]
saga = "saga.cli:main"

[tool.setuptools.packages.find]
include = ["saga*"]
